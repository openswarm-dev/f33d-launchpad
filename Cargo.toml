[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The Solana version this program is built with (solana-verify and OtterSec pick their build image from it).
[workspace.metadata.cli]
solana = "3.1.10"
